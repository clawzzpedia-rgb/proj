<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Ikan Goreng Tambaksari</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#D4A853;--gold-light:#E8C97A;--dark:#0A0A0A;--dark2:#141210;--dark3:#1e1c19;--cream:#F5F0E8;--green:#2D5A3D;--green-l:#3A7A50;--red:#C44536;--text:#E8E0D4;--muted:#9A9088;--radius:12px;--radius-sm:8px;--shadow:0 8px 32px rgba(0,0,0,.4)}
html{font-size:15px}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--dark2)}::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
a{color:var(--gold);text-decoration:none}

/* LOGIN */
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.login-box{background:var(--dark2);border:1px solid #2a2724;border-radius:var(--radius);padding:48px 40px;width:100%;max-width:400px;text-align:center;box-shadow:var(--shadow)}
.login-box h1{font-size:1.6rem;margin-bottom:6px;color:var(--gold)}
.login-box p{color:var(--muted);font-size:.9rem;margin-bottom:28px}
.login-box input{width:100%;padding:14px 16px;border:1px solid #333;border-radius:var(--radius-sm);background:#0d0c0b;color:var(--text);font-size:1rem;outline:none;transition:.2s}
.login-box input:focus{border-color:var(--gold)}
.login-box input::placeholder{color:#555}
.login-box button{width:100%;padding:14px;margin-top:14px;border:none;border-radius:var(--radius-sm);background:var(--gold);color:#000;font-weight:700;font-size:1rem;cursor:pointer;transition:.2s}
.login-box button:hover{background:var(--gold-light)}
.login-err{color:var(--red);font-size:.85rem;margin-top:10px;display:none}

/* DASHBOARD */
.dash{display:none;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:var(--dark2);border-bottom:1px solid #2a2724;position:sticky;top:0;z-index:90}
.topbar h2{font-size:1.1rem;color:var(--gold)}
.topbar-right{display:flex;gap:12px;align-items:center}
.topbar a,.topbar button{padding:8px 16px;border-radius:var(--radius-sm);font-size:.85rem;border:none;cursor:pointer;font-family:inherit}
.topbar .btn-outline{background:transparent;border:1px solid #444;color:var(--text)}
.topbar .btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.topbar .btn-danger{background:var(--red);color:#fff}
.topbar .btn-danger:hover{background:#a33}
.topbar .btn-gold{background:var(--gold);color:#000;font-weight:600}
.topbar .btn-gold:hover{background:var(--gold-light)}

.sidebar{position:fixed;left:0;top:53px;bottom:0;width:220px;background:var(--dark2);border-right:1px solid #2a2724;padding:20px 0;z-index:80;overflow-y:auto}
.sidebar a{display:flex;align-items:center;gap:10px;padding:11px 24px;color:var(--muted);font-size:.9rem;transition:.15s}
.sidebar a:hover,.sidebar a.active{color:var(--gold);background:rgba(212,168,83,.06)}
.sidebar a .icon{font-size:1.1rem;width:22px;text-align:center}
.main{margin-left:220px;padding:28px 32px 60px}

/* SECTIONS */
.section{display:none}
.section.active{display:block}
.section h3{font-size:1.3rem;margin-bottom:20px;color:var(--gold)}
.section h4{font-size:1rem;margin-bottom:12px;color:var(--text)}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.item-card{background:var(--dark2);border:1px solid #2a2724;border-radius:var(--radius);overflow:hidden;transition:.2s}
.item-card:hover{border-color:#444}
.item-card-img{width:100%;height:180px;object-fit:cover;background:#111;display:block}
.item-card-body{padding:16px}
.item-card-body h4{font-size:.95rem;margin-bottom:4px}
.item-card-body p{font-size:.82rem;color:var(--muted);margin-bottom:10px;line-height:1.5}
.item-card-body .price{color:var(--gold);font-weight:700;font-size:1rem}
.item-card-actions{display:flex;gap:8px;margin-top:12px}
.item-card-actions button{flex:1;padding:8px;border:1px solid #333;border-radius:var(--radius-sm);background:transparent;color:var(--text);font-size:.82rem;cursor:pointer;font-family:inherit;transition:.15s}
.item-card-actions .btn-edit:hover{border-color:var(--gold);color:var(--gold)}
.item-card-actions .btn-del:hover{border-color:var(--red);color:var(--red)}

/* FORMS */
.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:center;padding:20px}
.form-overlay.show{display:flex}
.form-box{background:var(--dark2);border:1px solid #2a2724;border-radius:var(--radius);padding:32px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.form-box h3{margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 14px;border:1px solid #333;border-radius:var(--radius-sm);background:#0d0c0b;color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:.2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--gold)}
.form-group textarea{resize:vertical;min-height:80px}
.form-group select option{background:#0d0c0b}
.form-btns{display:flex;gap:10px;margin-top:20px}
.form-btns button{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.form-btns .btn-save{background:var(--gold);color:#000}
.form-btns .btn-save:hover{background:var(--gold-light)}
.form-btns .btn-cancel{background:#333;color:var(--text)}
.form-btns .btn-cancel:hover{background:#444}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--dark2);border:1px solid #2a2724;border-radius:var(--radius);padding:20px;text-align:center}
.stat-card .num{font-size:1.8rem;font-weight:700;color:var(--gold)}
.stat-card .label{font-size:.82rem;color:var(--muted);margin-top:4px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:14px 22px;border-radius:var(--radius-sm);font-size:.9rem;z-index:300;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* RESPONSIVE */
@media(max-width:860px){
  .sidebar{width:100%;position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;display:flex;overflow-x:auto;border-right:none;border-top:1px solid #2a2724;padding:0;z-index:100}
  .sidebar a{flex-shrink:0;padding:12px 18px;font-size:.78rem;gap:6px;border:none}
  .sidebar a .txt{display:none}
  .sidebar a.active{background:rgba(212,168,83,.12)}
  .main{margin-left:0;padding:20px 16px 90px}
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>🐟 Admin Panel</h1>
    <p>Ikan Goreng Tambaksari</p>
    <input type="password" id="tokenInput" placeholder="Masukkan token akses..." autocomplete="off">
    <button onclick="doLogin()">Masuk</button>
    <div class="login-err" id="loginErr">Token salah. Silakan coba lagi.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dashboard">
  <div class="topbar">
    <h2>🐟 Admin Panel</h2>
    <div class="topbar-right">
      <button class="btn-outline" onclick="window.open('index.html','_blank')">🌐 Lihat Web</button>
      <button class="btn-gold" onclick="saveAll()">💾 Simpan Semua</button>
      <button class="btn-danger" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="sidebar">
    <a href="#" class="active" data-section="overview"><span class="icon">📊</span><span class="txt">Overview</span></a>
    <a href="#" data-section="menu"><span class="icon">🍽️</span><span class="txt">Menu</span></a>
    <a href="#" data-section="reviews"><span class="icon">⭐</span><span class="txt">Ulasan</span></a>
    <a href="#" data-section="ticker"><span class="icon">📢</span><span class="txt">Ticker</span></a>
    <a href="#" data-section="content"><span class="icon">📝</span><span class="txt">Konten</span></a>
  </div>

  <div class="main">

    <!-- OVERVIEW -->
    <div class="section active" id="sec-overview">
      <h3>Overview</h3>
      <div class="stats-row" id="statsRow"></div>
      <h4>Menu Terbaru</h4>
      <div class="card-grid" id="recentMenu"></div>
    </div>

    <!-- MENU -->
    <div class="section" id="sec-menu">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 style="margin:0">Menu Items</h3>
        <button class="topbar btn-gold" onclick="openMenuForm()">+ Tambah Menu</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap" id="menuFilters"></div>
      <div class="card-grid" id="menuList"></div>
    </div>

    <!-- REVIEWS -->
    <div class="section" id="sec-reviews">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 style="margin:0">Ulasan</h3>
        <button class="topbar btn-gold" onclick="openReviewForm()">+ Tambah Ulasan</button>
      </div>
      <div class="card-grid" id="reviewList"></div>
    </div>

    <!-- TICKER -->
    <div class="section" id="sec-ticker">
      <h3>Ticker / Running Text</h3>
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button class="topbar btn-gold" onclick="openTickerForm()">+ Tambah Ticker</button>
      </div>
      <div id="tickerList"></div>
    </div>

    <!-- CONTENT -->
    <div class="section" id="sec-content">
      <h3>Edit Konten Halaman</h3>
      <div class="card-grid" id="contentEditor"></div>
    </div>

  </div>
</div>

<!-- MENU FORM OVERLAY -->
<div class="form-overlay" id="menuFormOverlay">
  <div class="form-box">
    <h3 id="menuFormTitle">Tambah Menu</h3>
    <input type="hidden" id="menuEditIdx">
    <div class="form-group"><label>Nama Item</label><input id="mName" placeholder="Contoh: Ikan Barakuda Goreng"></div>
    <div class="form-group"><label>Deskripsi</label><textarea id="mDesc" placeholder="Deskripsi singkat item"></textarea></div>
    <div class="form-group"><label>Harga (angka saja)</label><input id="mPrice" placeholder="Contoh: 20000"></div>
    <div class="form-group"><label>Kategori</label>
      <select id="mCat"><option value="ikan">Ikan Goreng</option><option value="paket">Paket Hemat</option><option value="tambahan">Tambahan</option><option value="minuman">Minuman</option></select>
    </div>
    <div class="form-group"><label>URL Gambar</label><input id="mImg" placeholder="https://..."></div>
    <div class="form-group"><label>Badge (opsional)</label><input id="mBadge" placeholder="Favorit / Terlaris / Best / kosongkan jika tidak ada"></div>
    <div class="form-btns">
      <button class="btn-cancel" onclick="closeMenuForm()">Batal</button>
      <button class="btn-save" onclick="saveMenuItem()">Simpan</button>
    </div>
  </div>
</div>

<!-- REVIEW FORM OVERLAY -->
<div class="form-overlay" id="reviewFormOverlay">
  <div class="form-box">
    <h3 id="reviewFormTitle">Tambah Ulasan</h3>
    <input type="hidden" id="reviewEditIdx">
    <div class="form-group"><label>Nama</label><input id="rName" placeholder="Nama pelanggan"></div>
    <div class="form-group"><label>Kota</label><input id="rCity" placeholder="Contoh: Malang"></div>
    <div class="form-group"><label>Bintang (1-5)</label><input id="rStars" type="number" min="1" max="5" value="5"></div>
    <div class="form-group"><label>Isi Ulasan</label><textarea id="rText" placeholder="Tulisan ulasan"></textarea></div>
    <div class="form-group"><label>Waktu</label><input id="rTime" placeholder="Contoh: 2 hari lalu"></div>
    <div class="form-btns">
      <button class="btn-cancel" onclick="closeReviewForm()">Batal</button>
      <button class="btn-save" onclick="saveReviewItem()">Simpan</button>
    </div>
  </div>
</div>

<!-- TICKER FORM OVERLAY -->
<div class="form-overlay" id="tickerFormOverlay">
  <div class="form-box">
    <h3 id="tickerFormTitle">Tambah Ticker</h3>
    <input type="hidden" id="tickerEditIdx">
    <div class="form-group"><label>Teks Ticker</label><textarea id="tText" placeholder='⭐⭐⭐⭐⭐ "Ikan nya enak!" — Budi, Malang'></textarea></div>
    <div class="form-btns">
      <button class="btn-cancel" onclick="closeTickerForm()">Batal</button>
      <button class="btn-save" onclick="saveTickerItem()">Simpan</button>
    </div>
  </div>
</div>

<!-- CONTENT FORM OVERLAY -->
<div class="form-overlay" id="contentFormOverlay">
  <div class="form-box">
    <h3>Edit Konten</h3>
    <input type="hidden" id="contentKey">
    <div class="form-group"><label id="contentLabel">Nilai</label><textarea id="contentVal" rows="4"></textarea></div>
    <div class="form-btns">
      <button class="btn-cancel" onclick="closeContentForm()">Batal</button>
      <button class="btn-save" onclick="saveContentItem()">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
const TOKEN = '3411';
const SESSION_KEY = 'igt_admin_session';

function doLogin(){
  const v = document.getElementById('tokenInput').value.trim();
  if(v === TOKEN){
    sessionStorage.setItem(SESSION_KEY, '1');
    showDash();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('tokenInput').value = '';
    document.getElementById('tokenInput').focus();
  }
}
document.getElementById('tokenInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

function showDash(){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadData();
  renderAll();
}

if(sessionStorage.getItem(SESSION_KEY)){
  showDash();
}

// ═══════════════════════════════════════════════
// DATA STORE (localStorage)
// ═══════════════════════════════════════════════
const LS_KEY = 'igt_site_data';

const DEFAULT_DATA = {

    { cat:'ikan', name:'Ikan Dorang/Bawal Goreng', desc:'Bawal segar digoreng renyah, bumbu meresap sempurna', price:'22.000', img:'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=400&h=300&fit=crop', badge:'' },
    { cat:'ikan', name:'Ikan Belanak Goreng', desc:'Belanak segar dengan tepung renyah, sambal mantap', price:'15.000', img:'https://images.unsplash.com/photo-1455619452474-d2be8b1e70cd?w=400&h=300&fit=crop', badge:'' },
    { cat:'ikan', name:'Ikan Wader Goreng', desc:'Wader pilihan, goreng renyah, bumbu khas Tambaksari', price:'12.000', img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&h=300&fit=crop', badge:'' },
    { cat:'paket', name:'Paket Spesial', desc:'Ikan + nasi + sambal + lalapan + es teh', price:'18.000', img:'https://images.unsplash.com/photo-1512058564366-18510be2db19?w=400&h=300&fit=crop', badge:'Terlaris' },
    { cat:'paket', name:'Paket Keluarga', desc:'2 ikan besar + nasi 4 + sambal + lalapan + 4 es', price:'65.000', img:'https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=400&h=300&fit=crop', badge:'Hemat' },
    { cat:'paket', name:'Paket Mantap', desc:'3 jenis ikan + nasi 2 + sambal spesial + lalapan', price:'45.000', img:'https://images.unsplash.com/photo-1544943910-4c1dc44aab44?w=400&h=300&fit=crop', badge:'' },
    { cat:'tambahan', name:'Nasi Putih', desc:'Nasi putih pulen', price:'3.000', img:'https://images.unsplash.com/photo-1512058564366-18510be2db19?w=400&h=300&fit=crop', badge:'' },
    { cat:'tambahan', name:'Sambal Tambahan', desc:'Sambal homemade pedas', price:'2.000', img:'https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=400&h=300&fit=crop', badge:'' },
    { cat:'tambahan', name:'Lalapan Segar', desc:'Kangkung, kemangi, timun segar', price:'5.000', img:'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400&h=300&fit=crop', badge:'' },
    { cat:'minuman', name:'Es Teh Manis', desc:'Teh manis segar es batu', price:'4.000', img:'https://images.unsplash.com/photo-1497534446932-c925b458314e?w=400&h=300&fit=crop', badge:'' },

    { cat:'minuman', name:'Es Kelapa Muda', desc:'Kelapa muda segar langsung dari buahnya', price:'8.000', img:'https://images.unsplash.com/photo-1536935338788-846bb9981813?w=400&h=300&fit=crop', badge:'Best' },
  ],
  reviews: [
    { name:'Budi Santoso', initial:'B', stars:5, text:'Ikan goremnya renyah banget! Bumbu meresap sampai ke dalam. Sambalnya juga pedas mantap. Sudah jadi langganan tiap minggu.', time:'2 hari lalu', city:'Malang' },
    { name:'Rina Wulandari', initial:'R', stars:5, text:'Paket keluarga worth it banget! Ikan besar-besar, nasi banyak, harga terjangkau. Anak-anak suka semua. Recommended!', time:'3 hari lalu', city:'Surabaya' },
    { name:'Ahmad Fauzi', initial:'A', stars:4, text:'Ikan nilanya segar dan gorengnya pas. Cuma agak lama nunggunya pas jam makan siang. Tapi rasanya top!', time:'5 hari lalu', city:'Malang' },
    { name:'Siti Nurhaliza', initial:'S', stars:5, text:'Pertama kali coba dan langsung jatuh cinta! Ikan lele gorengnya juara banget. Bumbu khasnya beda dari yang lain. Pasti balik lagi!', time:'1 minggu lalu', city:'Batu' },

    '⭐⭐⭐⭐ "Gorengnya pas, bumbu meresap" — Ahmad, Malang',
    '⭐⭐⭐⭐⭐ "Anak-anak suka semua!" — Maya, Malang',
    '⭐⭐⭐⭐⭐ "Sudah jadi langganan tiap minggu!" — Budi, Malang',
    '⭐⭐⭐⭐⭐ "Tempat bersih, harga merakyat!" — Rina, Surabaya',
  ],
  content: {
    hero_title: 'Ikan Goreng Tambaksari',
    hero_subtitle: 'Lezatnya Ikan Segar dari Tambaksari',
    hero_badge: '🐟 Sejak 2016 — Tambaksari, Malang',
    hero_cta: 'Pesan Sekarang',
    about_text: 'Berdiri sejak 2016, Ikan Goreng Tambaksari telah menjadi ikon kuliner ikan goreng di kawasan Tambaksari, Malang. Kami hanya menggunakan ikan segar pilihan yang dibeli langsung dari tambak setiap pagi.',
    about_text2: 'Setiap ikan digoreng dengan minyak bersih dan bumbu racikan tradisional turun-temurun. Hasilnya? Ikan goreng renyah di luar, lembut dan juicy di dalam — bikin nagih setiap suapan!',
    whatsapp: '6281234567890',
    maps_embed: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15811.4!2d112.6145634!3d-7.9750215!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2dd7f8f1c1c1c1c1%3A0x1234567890abcdef!2sTambaksari%2C+Malang!5e0!3m2!1sid!2sid!4v1234567890'
  }
};

let siteData;

function loadData(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    siteData = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch(e){
    siteData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  // Ensure all keys exist
  if(!siteData.menu) siteData.menu = DEFAULT_DATA.menu;
  if(!siteData.reviews) siteData.reviews = DEFAULT_DATA.reviews;
  if(!siteData.ticker) siteData.ticker = DEFAULT_DATA.ticker;
  if(!siteData.content) siteData.content = DEFAULT_DATA.content;
}

function saveAll(){
  localStorage.setItem(LS_KEY, JSON.stringify(siteData));
  toast('✅ Semua perubahan tersimpan!');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════
// SIDEBAR NAV
// ═══════════════════════════════════════════════
document.querySelectorAll('.sidebar a').forEach(a=>{
  a.addEventListener('click', e=>{
    e.preventDefault();
    document.querySelectorAll('.sidebar a').forEach(x=>x.classList.remove('active'));
    a.classList.add('active');
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('sec-'+a.dataset.section).classList.add('active');
    if(a.dataset.section==='overview') renderOverview();
    if(a.dataset.section==='menu') renderMenuList();
    if(a.dataset.section==='reviews') renderReviewList();
    if(a.dataset.section==='ticker') renderTickerList();
    if(a.dataset.section==='content') renderContentEditor();
  });
});

// ═══════════════════════════════════════════════
// RENDER ALL
// ═══════════════════════════════════════════════
function renderAll(){
  renderOverview();
  renderMenuList();
  renderReviewList();
  renderTickerList();
  renderContentEditor();
}

// ═══════════════════════════════════════════════
// OVERVIEW
// ═══════════════════════════════════════════════
function renderOverview(){
  const cats = {};
  siteData.menu.forEach(m=>{ cats[m.cat] = (cats[m.cat]||0)+1; });
  const totalReviews = siteData.reviews.length;
  const avgStars = totalReviews ? (siteData.reviews.reduce((a,r)=>a+r.stars,0)/totalReviews).toFixed(1) : '0';

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="num">${siteData.menu.length}</div><div class="label">Total Menu</div></div>
    <div class="stat-card"><div class="num">${cats.ikan||0}</div><div class="label">Ikan Goreng</div></div>
    <div class="stat-card"><div class="num">${cats.paket||0}</div><div class="label">Paket Hemat</div></div>
    <div class="stat-card"><div class="num">${totalReviews}</div><div class="label">Ulasan</div></div>
    <div class="stat-card"><div class="num">${avgStars} ★</div><div class="label">Rating Rata-rata</div></div>
  `;

  document.getElementById('recentMenu').innerHTML = siteData.menu.slice(0,4).map(m=>`
    <div class="item-card">
      <img class="item-card-img" src="${m.img}" alt="${m.name}">
      <div class="item-card-body">
        <h4>${m.name}</h4>
        <p>${m.desc}</p>
        <div class="price">Rp ${m.price}</div>
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════
// MENU CRUD
// ═══════════════════════════════════════════════
let menuFilter = 'all';

function renderMenuFilters(){
  const cats = [{k:'all',l:'Semua'},{k:'ikan',l:'Ikan'},{k:'paket',l:'Paket'},{k:'tambahan',l:'Tambahan'},{k:'minuman',l:'Minuman'}];
  document.getElementById('menuFilters').innerHTML = cats.map(c=>
    `<button onclick="setMenuFilter('${c.k}')" style="padding:8px 16px;border-radius:20px;border:1px solid ${menuFilter===c.k?'var(--gold)':'#333'};background:${menuFilter===c.k?'var(--gold)':'transparent'};color:${menuFilter===c.k?'#000':'var(--text)'};cursor:pointer;font-family:inherit;font-size:.82rem">${c.l}</button>`
  ).join('');
}

function setMenuFilter(cat){ menuFilter=cat; renderMenuList(); }

function renderMenuList(){
  renderMenuFilters();
  const items = menuFilter==='all' ? siteData.menu : siteData.menu.filter(m=>m.cat===menuFilter);
  document.getElementById('menuList').innerHTML = items.map((m,i)=>{
    const realIdx = siteData.menu.indexOf(m);
    return `
    <div class="item-card">
      <img class="item-card-img" src="${m.img}" alt="${m.name}">
      <div class="item-card-body">
        ${m.badge?`<span style="background:var(--gold);color:#000;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;display:inline-block;margin-bottom:8px">${m.badge}</span>`:''}
        <h4>${m.name}</h4>
        <p>${m.desc}</p>
        <div class="price">Rp ${m.price}</div>
        <div class="item-card-actions">
          <button class="btn-edit" onclick="editMenuItem(${realIdx})">✏️ Edit</button>
          <button class="btn-del" onclick="deleteMenuItem(${realIdx})">🗑️ Hapus</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openMenuForm(idx){
  document.getElementById('menuFormOverlay').classList.add('show');
  if(idx===undefined){
    document.getElementById('menuFormTitle').textContent='Tambah Menu';
    document.getElementById('menuEditIdx').value='';
    ['mName','mDesc','mPrice','mImg','mBadge'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('mCat').value='ikan';
  }
}
function closeMenuForm(){ document.getElementById('menuFormOverlay').classList.remove('show'); }

function editMenuItem(idx){
  const m = siteData.menu[idx];
  document.getElementById('menuEditIdx').value = idx;
  document.getElementById('menuFormTitle').textContent = 'Edit Menu';
  document.getElementById('mName').value = m.name;
  document.getElementById('mDesc').value = m.desc;
  document.getElementById('mPrice').value = m.price;
  document.getElementById('mCat').value = m.cat;
  document.getElementById('mImg').value = m.img;
  document.getElementById('mBadge').value = m.badge;
  document.getElementById('menuFormOverlay').classList.add('show');
}

function saveMenuItem(){
  const name = document.getElementById('mName').value.trim();
  const desc = document.getElementById('mDesc').value.trim();
  const price = document.getElementById('mPrice').value.trim();
  const cat = document.getElementById('mCat').value;
  const img = document.getElementById('mImg').value.trim();
  const badge = document.getElementById('mBadge').value.trim();
  if(!name||!price){ alert('Nama dan harga wajib diisi!'); return; }
  const item = { cat, name, desc, price, img, badge };
  const idx = document.getElementById('menuEditIdx').value;
  if(idx===''){
    siteData.menu.push(item);
  } else {
    siteData.menu[parseInt(idx)] = item;
  }
  saveAll();
  closeMenuForm();
  renderMenuList();
  renderOverview();
}

function deleteMenuItem(idx){
  if(!confirm('Hapus item ini?')) return;
  siteData.menu.splice(idx,1);
  saveAll();
  renderMenuList();
  renderOverview();
}

// ═══════════════════════════════════════════════
// REVIEW CRUD
// ═══════════════════════════════════════════════
function renderReviewList(){
  document.getElementById('reviewList').innerHTML = siteData.reviews.map((r,i)=>`
    <div class="item-card">
      <div class="item-card-body">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <div style="width:44px;height:44px;border-radius:50%;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0">${r.name[0]}</div>
          <div>
            <h4 style="margin:0">${r.name}</h4>
            <p style="margin:0;font-size:.78rem;color:var(--muted)">${r.city} · ${r.time}</p>
          </div>
          <div style="margin-left:auto;color:var(--gold);font-size:1rem">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div>
        </div>
        <p style="line-height:1.6">${r.text}</p>
        <div class="item-card-actions">
          <button class="btn-edit" onclick="editReviewItem(${i})">✏️ Edit</button>
          <button class="btn-del" onclick="deleteReviewItem(${i})">🗑️ Hapus</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openReviewForm(){
  document.getElementById('reviewFormOverlay').classList.add('show');
  document.getElementById('reviewFormTitle').textContent='Tambah Ulasan';
  document.getElementById('reviewEditIdx').value='';
  ['rName','rCity','rText','rTime'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('rStars').value=5;
}
function closeReviewForm(){ document.getElementById('reviewFormOverlay').classList.remove('show'); }

function editReviewItem(idx){
  const r = siteData.reviews[idx];
  document.getElementById('reviewEditIdx').value = idx;
  document.getElementById('reviewFormTitle').textContent = 'Edit Ulasan';
  document.getElementById('rName').value = r.name;
  document.getElementById('rCity').value = r.city;
  document.getElementById('rStars').value = r.stars;
  document.getElementById('rText').value = r.text;
  document.getElementById('rTime').value = r.time;
  document.getElementById('reviewFormOverlay').classList.add('show');
}

function saveReviewItem(){
  const name = document.getElementById('rName').value.trim();
  const city = document.getElementById('rCity').value.trim() || 'Tidak disebutkan';
  const stars = parseInt(document.getElementById('rStars').value)||5;
  const text = document.getElementById('rText').value.trim();
  const time = document.getElementById('rTime').value.trim() || 'Baru saja';
  if(!name||!text){ alert('Nama dan ulasan wajib diisi!'); return; }
  const item = { name, initial:name[0].toUpperCase(), stars:Math.min(5,Math.max(1,stars)), text, time, city };
  const idx = document.getElementById('reviewEditIdx').value;
  if(idx===''){
    siteData.reviews.unshift(item);
  } else {
    siteData.reviews[parseInt(idx)] = item;
  }
  saveAll();
  closeReviewForm();
  renderReviewList();
  renderOverview();
}

function deleteReviewItem(idx){
  if(!confirm('Hapus ulasan ini?')) return;
  siteData.reviews.splice(idx,1);
  saveAll();
  renderReviewList();
  renderOverview();
}

// ═══════════════════════════════════════════════
// TICKER CRUD
// ═══════════════════════════════════════════════
function renderTickerList(){
  document.getElementById('tickerList').innerHTML = siteData.ticker.map((t,i)=>`
    <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--dark2);border:1px solid #2a2724;border-radius:var(--radius-sm);margin-bottom:8px">
      <span style="flex:1;font-size:.9rem">${t}</span>
      <button onclick="editTickerItem(${i})" style="padding:6px 12px;border:1px solid #444;border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:.8rem">✏️</button>
      <button onclick="deleteTickerItem(${i})" style="padding:6px 12px;border:1px solid var(--red);border-radius:6px;background:transparent;color:var(--red);cursor:pointer;font-size:.8rem">🗑️</button>
    </div>
  `).join('');
}

function openTickerForm(){
  document.getElementById('tickerFormOverlay').classList.add('show');
  document.getElementById('tickerFormTitle').textContent='Tambah Ticker';
  document.getElementById('tickerEditIdx').value='';
  document.getElementById('tText').value='';
}
function closeTickerForm(){ document.getElementById('tickerFormOverlay').classList.remove('show'); }

function editTickerItem(idx){
  document.getElementById('tickerEditIdx').value = idx;
  document.getElementById('tickerFormTitle').textContent = 'Edit Ticker';
  document.getElementById('tText').value = siteData.ticker[idx];
  document.getElementById('tickerFormOverlay').classList.add('show');
}

function saveTickerItem(){
  const text = document.getElementById('tText').value.trim();
  if(!text){ alert('Teks tidak boleh kosong!'); return; }
  const idx = document.getElementById('tickerEditIdx').value;
  if(idx===''){
    siteData.ticker.push(text);
  } else {
    siteData.ticker[parseInt(idx)] = text;
  }
  saveAll();
  closeTickerForm();
  renderTickerList();
}

function deleteTickerItem(idx){
  if(!confirm('Hapus ticker ini?')) return;
  siteData.ticker.splice(idx,1);
  saveAll();
  renderTickerList();
}

// ═══════════════════════════════════════════════
// CONTENT EDITOR
// ═══════════════════════════════════════════════
const CONTENT_FIELDS = [
  { key:'hero_title', label:'Judul Hero', type:'text' },
  { key:'hero_subtitle', label:'Sub Judul Hero', type:'text' },
  { key:'hero_badge', label:'Badge Hero', type:'text' },
  { key:'hero_cta', label:'Tombol CTA Hero', type:'text' },
  { key:'about_text', label:'Tentang Kami (paragraf 1)', type:'textarea' },
  { key:'about_text2', label:'Tentang Kami (paragraf 2)', type:'textarea' },
  { key:'whatsapp', label:'Nomor WhatsApp (format: 628xxx)', type:'text' },
  { key:'maps_embed', label:'Google Maps Embed URL', type:'text' },
];

function renderContentEditor(){
  document.getElementById('contentEditor').innerHTML = CONTENT_FIELDS.map(f=>{
    const val = siteData.content[f.key]||'';
    const display = val.length>120 ? val.substring(0,120)+'...' : val;
    return `
    <div class="item-card">
      <div class="item-card-body">
        <h4>${f.label}</h4>
        <p style="word-break:break-all">${display}</p>
        <div class="item-card-actions">
          <button class="btn-edit" onclick="editContent('${f.key}','${f.label.replace(/'/g,"\\'")}')">✏️ Edit</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function editContent(key,label){
  document.getElementById('contentKey').value = key;
  document.getElementById('contentLabel').textContent = label;
  document.getElementById('contentVal').value = siteData.content[key]||'';
  document.getElementById('contentFormOverlay').classList.add('show');
}
function closeContentForm(){ document.getElementById('contentFormOverlay').classList.remove('show'); }

function saveContentItem(){
  const key = document.getElementById('contentKey').value;
  const val = document.getElementById('contentVal').value;
  siteData.content[key] = val;
  saveAll();
  closeContentForm();
  renderContentEditor();
}

// ═══════════════════════════════════════════════
// RESET TO DEFAULT
// ═══════════════════════════════════════════════
function resetToDefault(){
  if(!confirm('Reset semua data ke default? Perubahan yang belum disimpan akan hilang.')) return;
  siteData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveAll();
  renderAll();
  toast('🔄 Data berhasil di-reset ke default!');
}

// Close overlay on escape
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    document.querySelectorAll('.form-overlay.show').forEach(o=>o.classList.remove('show'));
  }
});
</script>
